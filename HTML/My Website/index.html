    <h2>Employee Details</h2>

    <button onclick="startProgram()">
        Enter Employee Details
    </button>

    <h3>Output:</h3>

    <div id="output"></div>

    <script>

        function employee(name, company, gender) {

            if (gender == 'M' || gender == 'm') {

                return "Name of the Student is " + name +
                       " and he works in the company " + company;

            } else if (gender == 'F' || gender == 'f') {

                return "Name of the Student is " + name +
                       " and she works in the company " + company;

            } else {

                return "Invalid Gender for " + name;

            }
        }

        function startProgram() {

            let num = prompt("Enter the total number of Students:");

            if (num === null || num.trim() === "" ||
                !Number.isInteger(Number(num)) || Number(num) < 1) {
                alert("Please enter a valid number!");
                return;
            }

            num = Number(num);

            let result = "";

            for (let i = 0; i < num; i++) {

                let name = prompt("Enter the name of the Student:");

                if (name === null) return;

                let company = prompt("Enter the name of the Company:");

                if (company === null) return;

                let gender = prompt("Enter the Gender of the Student (M / F):");

                if (gender === null) return;

                result += employee(name, company, gender) + "<br><br>";

            }

            document.getElementById("output").innerHTML = result;

        }

    </script>
